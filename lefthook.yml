pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: .venv/bin/ruff format {staged_files}
      stage_fixed: true
    ruff-check:
      glob: "*.py"
      run: .venv/bin/ruff check --fix {staged_files}
      stage_fixed: true
    markdownlint:
      glob: "*.md"
      run: bunx markdownlint --fix {staged_files}
      stage_fixed: true
    prettier-yaml:
      glob: "*.{yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    prettier-json:
      glob: "*.json"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bunx --bun commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    ruff-format-check:
      run: .venv/bin/ruff format --check .
    ruff-check:
      run: .venv/bin/ruff check .
    markdownlint:
      run: bunx markdownlint '**/*.md' --ignore node_modules --ignore output --ignore CHANGELOG.md
    prettier-yaml:
      run: bunx prettier --check '**/*.{yml,yaml}' --ignore-path .gitignore
    prettier-json:
      run: bunx prettier --check '**/*.json' --ignore-path .gitignore
