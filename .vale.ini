StylesPath = styles
MinAlertLevel = warning

# Downloaded by `vale sync`, not committed. The two directories they land in are
# ignored by name in .gitignore, so styles/config/ stays tracked with them.
Packages = Google, proselint

# Holds the spellings this project insists on — org-roam, Obsidian, frontmatter
# and so on. Without it the spell-checker flags every one of them. Vale treats
# Vocab as a core option, so it has to sit above the syntax sections below.
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint, House

# Enforces the casing in that vocabulary, so "Github" and "javascript" are
# flagged where GitHub and JavaScript are the accepted forms.
Vale.Terms = YES

# The prose here is British English. Google's style guide is written for
# American spelling and would flag every "behaviour" in the file.
Google.Spelling = NO

# The first person plural is fine in a README that explains a decision.
Google.We = NO

# The house style is a spaced em dash — like this one. Google's rule wants them
# closed up, which would rewrite every aside in the file.
Google.EmDash = NO

# release-please writes this file from commit subjects. Generated text belongs
# to nobody's style guide. This section is currently dead — see #150 — so the
# real exclusion is the --glob flag on `lint:prose` in package.json and the
# `exclude:` on lefthook's own `vale` command; this stays as the documented
# intent for whenever #150 is fixed.
[CHANGELOG.md]
BasedOnStyles =
