name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run ruff check
        run: ruff check .

  # Fails only on advisories this change adds to requirements-dev.txt over its base
  # (rules/dependencies.md). What is already on main is the scan's to track, in
  # advisory-scan.yml, so a new advisory never turns an unrelated pull request red. The
  # job always runs and reports; its steps run only when requirements-dev.txt changed,
  # and on a push to main. convert.py has no dependencies outside the standard library,
  # so the pinned dev tooling is the whole tree.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${EVENT}" != pull_request ]; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Captured first, so a git failure (missing base) stops the step under bash -e
          # instead of reading as "nothing changed" and skipping the gate.
          files=$(git diff --name-only "${BASE}...HEAD")
          if printf '%s\n' "${files}" | grep -Eq '^(requirements-dev\.txt|\.github/workflows/lint\.yml)$'; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changed.outputs.deps == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pip-audit
        if: steps.changed.outputs.deps == 'true'
        run: pip install pip-audit==2.10.1

      # Pinned to a main commit of alrayyes/advisory-scan until its first release; re-pin then.
      - name: Audit what this change adds
        if: steps.changed.outputs.deps == 'true'
        uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68
        with:
          mode: gate
          command: pip-audit -r requirements-dev.txt

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prettier owns the layout, so it is checked first: if it fails there is
      # no point asking markdownlint about a file that is about to be rewritten.
      - name: Check Markdown formatting
        run: bun run format:md

      - name: Run markdownlint
        run: bun run lint:md

  prettier:
    name: Prettier (YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run prettier on YAML
        run: bun run lint:yaml

  biome:
    name: Biome (JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome
        run: bun run lint:json

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate PR commits with commitlint
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
