# The scan half of rules/dependencies.md: audit main and keep one open "Dependency advisories"
# issue that lists what's there. Daily for advisories published against pins that haven't
# moved, on a requirements push so a merged fix closes the ticket at once, and by hand. An
# audit that errors (PyPI down) fails the job and leaves the ticket alone.
name: Advisory scan

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths: [requirements-dev.txt, .github/workflows/advisory-scan.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # convert.py has no dependencies outside the standard library, so the only
      # thing to audit is the pinned dev tooling in requirements-dev.txt.
      - run: pip install pip-audit==2.10.1
      # Pinned to a main commit of alrayyes/advisory-scan until its first release; re-pin then.
      - uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68
        with:
          mode: scan
          command: pip-audit -r requirements-dev.txt
          labels: dependencies
