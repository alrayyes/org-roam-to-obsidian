# The scan half of rules/dependencies.md: audit main and keep one open "Dependency advisories"
# issue that lists what's there. Daily for advisories published against pins that haven't
# moved, on a requirements or bun.lock push so a merged fix closes the ticket at once, and by
# hand. Both ecosystems (requirements-dev.txt through pip-audit, bun.lock through bun audit)
# feed the one ticket. An audit that errors (PyPI or the npm registry down) fails the job
# and leaves the ticket alone.
name: Advisory scan

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths: [requirements-dev.txt, package.json, bun.lock, .github/workflows/advisory-scan.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # convert.py has no dependencies outside the standard library, so the only
      # thing to audit is the pinned dev tooling in requirements-dev.txt.
      - run: pip install pip-audit==2.10.1
      # bun audit reads bun.lock directly; the version is the one lint.yml pins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: alrayyes/advisory-scan@9801551dad16ce63853b2babfda885365d368232 # v0.3.0
        with:
          mode: scan
          # One line per audit, so an error in either fails the job instead of hiding
          # behind the other's advisory IDs.
          commands: |
            pip-audit -r requirements-dev.txt
            bun audit
          labels: dependencies
