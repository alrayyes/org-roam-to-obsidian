name: Dependency review

# GHAS-backed, so private-repo scanning would need an org licence this repo
# doesn't have — but this repo is public, where dependency-review-action
# needs nothing further to run. Catches a PR introducing a new dependency
# already known to be vulnerable at merge time, instead of waiting for
# Dependabot's next scheduled scan.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
