name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No compatibility matrix: this repo is under full control, with no
      # external consumers to support, so requires-python targets latest
      # stable rather than a wide floor. One version to test, not two.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov --cov-report=xml

      # GitHub doesn't pass repository secrets to a Dependabot-triggered
      # pull_request run, so CODECOV_TOKEN resolves empty there and the
      # upload fails with "Token required because branch is protected" -
      # unrelated to whatever the PR actually bumped. The tests themselves
      # already ran above regardless; only the coverage report upload
      # needs skipping.
      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
