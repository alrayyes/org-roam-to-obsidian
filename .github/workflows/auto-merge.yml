name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # release-please now authors its PR as github-actions[bot] again (no more
    # RELEASE_TOKEN -- see release.yml), but the title stays the signal here
    # rather than switching back to actor, since it's already proven stable
    # across #146/#149 and needs no change to test the token removal.
    if: |
      startsWith(github.event.pull_request.title, 'chore(main): release') ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
