name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_TOKEN (a real-identity PAT) used to sit here instead of the
      # default GITHUB_TOKEN, worked around as a GITHUB_TOKEN anti-recursion
      # issue in #149. backup-git-repos and washy-washy-cli run this same
      # release-please + native-auto-merge pipeline on plain GITHUB_TOKEN
      # with no PAT and no stuck approvals, and this repo's own branch
      # protection has required approving reviews at 0 -- there's nothing
      # left for a PAT to be working around. Testing the removal here.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag major and minor versions
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -d v${{ steps.release.outputs.major }} 2>/dev/null || true
          git tag -d v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} 2>/dev/null || true
          git push origin :v${{ steps.release.outputs.major }} 2>/dev/null || true
          git push origin :v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} 2>/dev/null || true
          git tag -a v${{ steps.release.outputs.major }} -m "Release v${{ steps.release.outputs.major }}"
          git tag -a v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} -m "Release v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}"
          git push origin v${{ steps.release.outputs.major }}
          git push origin v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
