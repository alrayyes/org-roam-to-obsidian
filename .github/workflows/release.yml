name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_TOKEN, not the default GITHUB_TOKEN: a release PR authored
      # by GITHUB_TOKEN sits at "action_required" with zero jobs run, since
      # GitHub's fork-PR-workflow approval gate treats a token-authored PR
      # like an outside contributor's even on the repo's own branch. #167
      # tested removing this based on backup-git-repos/washy-washy-cli
      # working fine on GITHUB_TOKEN alone -- reverting now that movie-planner
      # and tempus-fugit both independently confirmed the same action_required
      # wall those two repos happen not to hit, for reasons still unconfirmed.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag major and minor versions
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -d v${{ steps.release.outputs.major }} 2>/dev/null || true
          git tag -d v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} 2>/dev/null || true
          git push origin :v${{ steps.release.outputs.major }} 2>/dev/null || true
          git push origin :v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} 2>/dev/null || true
          git tag -a v${{ steps.release.outputs.major }} -m "Release v${{ steps.release.outputs.major }}"
          git tag -a v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} -m "Release v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}"
          git push origin v${{ steps.release.outputs.major }}
          git push origin v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
