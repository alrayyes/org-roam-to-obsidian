name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to ghcr.io. Nothing else in this job writes anything.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # A pull request build proves the Dockerfile still works without
      # publishing anything, so login only happens when we are going to push.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest follows main; a release tag also publishes its exact version
          # and the moving major and minor tags release-please maintains.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # convert.py runs anywhere Python does, and arm64 is what a Mac pulls.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if it converts, so the built image runs against
      # a note fixture and the output is checked rather than assumed.
      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          docker build -t smoke:test .
          mkdir -p /tmp/in /tmp/out
          printf ':PROPERTIES:\n:ID:       abc\n:END:\n#+title: Smoke\n\n* Heading\n' > /tmp/in/20200101000000-smoke.org
          # As the invoking user, which is what the README tells anyone whose
          # uid is not 1000 to do. The runner's is 1001, so without this the
          # container cannot write to the mount.
          docker run --rm --user "$(id -u):$(id -g)" \
            -v /tmp/in:/input:ro -v /tmp/out:/output smoke:test
          # Named after the title, not the org filename, which is what makes
          # a [[wikilink]] resolve in Obsidian.
          test -f "/tmp/out/Smoke.md" || { echo "no output written"; ls -la /tmp/out; exit 1; }
          grep -q '^title: Smoke' "/tmp/out/Smoke.md" || { echo "no title in frontmatter"; exit 1; }
          grep -q '^## Heading' "/tmp/out/Smoke.md" || { echo "heading not shifted below the title"; exit 1; }
          echo "image converts correctly"
