name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to ghcr.io. Nothing else in this job writes anything.
      packages: write
      # For the provenance attestation below: id-token to mint the OIDC token
      # Sigstore signs with, attestations to publish the result.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # A pull request build proves the Dockerfile still works without
      # publishing anything, so login only happens when we are going to push.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest follows main; a release tag also publishes its exact version
          # and the moving major and minor tags release-please maintains.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # convert.py runs anywhere Python does, and arm64 is what a Mac pulls.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ties the pushed image to the workflow run that built it with a signed,
      # Sigstore-backed attestation — SLSA Build L2, free, nothing to rotate.
      # Only meaningful for an image actually pushed, so this skips PR builds
      # the same way login and push above do.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The image is only useful if it converts, so the built image runs against
      # a note fixture and the output is checked rather than assumed.
      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          docker build -t smoke:test .
          mkdir -p /tmp/in /tmp/out
          printf ':PROPERTIES:\n:ID:       abc\n:END:\n#+title: Smoke\n\n* Heading\n' > /tmp/in/20200101000000-smoke.org
          # As the invoking user, which is what the README tells anyone whose
          # uid is not 1000 to do. The runner's is 1001, so without this the
          # container cannot write to the mount.
          docker run --rm --user "$(id -u):$(id -g)" \
            -v /tmp/in:/input:ro -v /tmp/out:/output smoke:test
          # Named after the title, not the org filename, which is what makes
          # a [[wikilink]] resolve in Obsidian.
          test -f "/tmp/out/Smoke.md" || { echo "no output written"; ls -la /tmp/out; exit 1; }
          grep -q '^title: Smoke' "/tmp/out/Smoke.md" || { echo "no title in frontmatter"; exit 1; }
          grep -q '^## Heading' "/tmp/out/Smoke.md" || { echo "heading not shifted below the title"; exit 1; }
          echo "image converts correctly"
