name: PR title

# commitlint only ever reads commit objects, so it never sees the PR title -
# and on this squash-merge repo, GitHub defaults the squash commit message to
# that title. A PR with clean commits and a title reading "fixed stuff"
# squashes straight past commitlint and lands exactly that on main.
#
# pull_request_target, not pull_request: this needs base-repo permissions to
# work on PRs opened from forks.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      # Mirror the types list from @commitlint/config-conventional so the two
      # checks agree on what's a valid type.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
