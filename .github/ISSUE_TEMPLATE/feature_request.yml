name: Feature request
description: Something the converter should do that it doesn't yet
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "As a <who>, I want <what>, so that <why>."
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: 3-5 testable Given/When/Then rules.
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
    validations:
      required: true
