version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # bun dependencies. Not "npm" - that ecosystem only knows how to
  # regenerate package-lock.json/yarn.lock/pnpm-lock.yaml, so it left
  # bun.lock stale on every bump and broke every job that runs
  # `bun install --frozen-lockfile` (#103).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # Python dependencies (requirements-dev.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # flake.nix's own inputs (nixpkgs, flake-utils), pinned in flake.lock.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # The Dockerfile's base image (python:3.13-alpine, digest-pinned). Ships
  # in the published container, unlike the dev-tooling entries above.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      prefix-development: "fix"
      include: "scope"
